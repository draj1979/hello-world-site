<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Kartavya Technology | AI Venture Builder</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <meta name="description" content="Kartavya Technology is a Venture Builder dedicated to conceiving, building, and scaling AI-first companies with long-term ownership and execution focus." />
  <style>
    :root {
      --bg-1: #0b0820;
      --bg-2: #1b0f3a;
      --accent-1: #ff7ab6;
      --accent-2: #7afcff;
      --accent-3: #ffd166;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; min-height: 100%; }
    body {
      font-family: "Inter", system-ui, -apple-system, Segoe UI, sans-serif;
      color: #f8fafc;
      background: radial-gradient(ellipse at 20% 10%, var(--bg-2), var(--bg-1) 60%);
      overflow-x: hidden;
    }

    /* Hero "image": animated gradient + orbs */
    .hero {
      position: relative;
      width: 100%;
      min-height: 100vh;
      display: grid;
      place-items: center;
      isolation: isolate;
      overflow: hidden;
      padding: 6rem 1.5rem 4rem;
    }
    .hero::before,
    .hero::after,
    .orb {
      content: "";
      position: absolute;
      border-radius: 50%;
      filter: blur(60px);
      opacity: 0.55;
      z-index: -1;
      animation: float 14s ease-in-out infinite;
      pointer-events: none;
    }
    .hero::before {
      width: 520px; height: 520px;
      background: radial-gradient(circle, var(--accent-1), transparent 60%);
      top: -120px; left: -120px;
    }
    .hero::after {
      width: 600px; height: 600px;
      background: radial-gradient(circle, var(--accent-2), transparent 60%);
      bottom: -160px; right: -160px;
      animation-delay: -6s;
    }
    .orb {
      width: 380px; height: 380px;
      background: radial-gradient(circle, var(--accent-3), transparent 60%);
      top: 40%; left: 55%;
      animation-delay: -3s;
      opacity: 0.4;
    }
    @keyframes float {
      0%,100% { transform: translate(0,0) scale(1); }
      33%     { transform: translate(40px,-30px) scale(1.08); }
      66%     { transform: translate(-30px,40px) scale(0.95); }
    }

    .grid {
      position: absolute; inset: 0; z-index: -1;
      background-image:
        linear-gradient(rgba(255,255,255,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.04) 1px, transparent 1px);
      background-size: 56px 56px;
      mask-image: radial-gradient(ellipse at center, black 40%, transparent 75%);
    }

    .stack {
      max-width: 980px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .headline {
      font-weight: 800;
      font-size: clamp(2.5rem, 7vw, 5.5rem);
      letter-spacing: -0.03em;
      line-height: 1.05;
      margin: 0;
    }
    .headline .word {
      display: inline-block;
      opacity: 0;
      transform: translateY(24px);
      animation: rise 0.8s cubic-bezier(.2,.8,.2,1) forwards;
    }
    .headline .word:nth-child(1) { animation-delay: 0.10s; }
    .headline .word:nth-child(2) { animation-delay: 0.18s; }
    .headline .word:nth-child(3) { animation-delay: 0.26s; }
    .headline .word:nth-child(4) { animation-delay: 0.34s; }
    .headline .word:nth-child(5) { animation-delay: 0.42s; }
    .headline .word:nth-child(6) { animation-delay: 0.50s; }
    .headline .word:nth-child(7) { animation-delay: 0.58s; }

    .accent {
      background: linear-gradient(120deg, var(--accent-1), var(--accent-3) 40%, var(--accent-2) 80%);
      background-size: 250% 250%;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: shimmer 8s ease-in-out infinite;
      filter: drop-shadow(0 8px 30px rgba(255,122,182,0.25));
    }
    @keyframes shimmer {
      0%,100% { background-position: 0% 50%; }
      50%     { background-position: 100% 50%; }
    }
    @keyframes rise {
      to { opacity: 1; transform: translateY(0); }
    }

    .subline {
      margin: 1.75rem auto 0;
      max-width: 720px;
      font-size: clamp(1rem, 1.4vw, 1.15rem);
      line-height: 1.6;
      color: rgba(248, 250, 252, 0.78);
      opacity: 0;
      animation: rise 0.9s ease 0.7s forwards;
    }

    .cta-group {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      justify-content: center;
      margin-top: 2.25rem;
      opacity: 0;
      animation: rise 0.9s ease 0.95s forwards;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.85rem 1.6rem;
      font-weight: 600;
      font-size: 0.95rem;
      border-radius: 999px;
      text-decoration: none;
      transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
      cursor: pointer;
      border: 1px solid transparent;
    }
    .btn-primary {
      color: #0b0820;
      background: linear-gradient(120deg, var(--accent-1), var(--accent-3) 50%, var(--accent-2));
      box-shadow: 0 10px 30px rgba(255, 122, 182, 0.35);
    }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 14px 36px rgba(255, 122, 182, 0.45); }
    .btn-outline {
      color: #f8fafc;
      background: transparent;
      border-color: rgba(248, 250, 252, 0.35);
    }
    .btn-outline:hover { background: rgba(248, 250, 252, 0.08); transform: translateY(-2px); }

    /* Logo (top-left) */
    .logo {
      position: absolute;
      top: clamp(1rem, 2.5vw, 2rem);
      left: clamp(1rem, 2.5vw, 2rem);
      display: inline-flex;
      align-items: center;
      gap: 0.7rem;
      text-decoration: none;
      color: #f8fafc;
      z-index: 2;
      opacity: 0;
      transform: translateY(-10px);
      animation: fade-down 0.8s ease 0.2s forwards;
    }
    .logo-mark {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--accent-1), var(--accent-3) 55%, var(--accent-2));
      display: grid;
      place-items: center;
      box-shadow: 0 6px 20px rgba(255, 122, 182, 0.35);
      font-weight: 800;
      font-size: 1.2rem;
      color: #0b0820;
      letter-spacing: -0.04em;
    }
    .logo-word {
      font-weight: 700;
      font-size: 1rem;
      letter-spacing: 0.02em;
    }
    @keyframes fade-down {
      to { opacity: 1; transform: translateY(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
      .headline .word, .subline, .cta-group, .logo { opacity: 1; transform: none; }
    }
  </style>
</head>
<body>
  <section class="hero">
    <a class="logo" href="/" aria-label="Kartavya Technology home">
      <span class="logo-mark" aria-hidden="true">K</span>
      <span class="logo-word">Kartavya</span>
    </a>
    <div class="grid" aria-hidden="true"></div>
    <div class="orb" aria-hidden="true"></div>

    <div class="stack">
      <h1 class="headline">
        <span class="word">We</span>
        <span class="word">Conceive,</span>
        <span class="word">Build,</span>
        <span class="word">and</span>
        <span class="word">Scale</span>
        <span class="word accent">AI-First</span>
        <span class="word accent">Companies.</span>
      </h1>
      <p class="subline">
        Kartavya Technology is a Venture Builder. We don't just invest or advise.
        We provide the leadership, architecture, and execution engine to turn ideas
        into category-defining AI companies.
      </p>
      <div class="cta-group">
        <a class="btn btn-primary" href="#model">Our Model</a>
        <a class="btn btn-outline" href="#build">Build With Us</a>
      </div>
    </div>
  </section>
</body>
</html>
